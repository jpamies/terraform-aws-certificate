name: "Auto Tag and Release"

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - "README.md"
      - "CHANGELOG.md"
      - "LICENSE"
      - ".gitignore"
      - ".github/**"

permissions:
  contents: write

jobs:
  # First run the tests to make sure everything is working
  terraform:
    name: "Terraform Tests"
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.7
          terraform_wrapper: false

      - name: Terraform Format
        id: fmt
        run: terraform fmt -check -recursive

      - name: Terraform Init
        id: init
        run: terraform init -backend=false

      - name: Terraform Validate
        id: validate
        run: terraform validate

  # If tests pass, create a new tag and release
  tag-release:
    name: "Create Tag and Release"
    needs: terraform
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: Determine version bump type
        id: bump_type
        run: |
          # Check commit messages since last tag to determine version bump type
          git fetch --tags
          LATEST_TAG=$(git tag -l 'v*' --sort=-v:refname | head -n 1)
          
          if [ -z "$LATEST_TAG" ]; then
            echo "No existing tags found"
            echo "BUMP_TYPE=patch" >> $GITHUB_OUTPUT
          else
            # Look for specific keywords in commit messages
            COMMITS=$(git log $LATEST_TAG..HEAD --pretty=format:"%s")
            
            if echo "$COMMITS" | grep -i -E '(BREAKING CHANGE|BREAKING-CHANGE|major)'; then
              echo "Found breaking change, bumping major version"
              echo "BUMP_TYPE=major" >> $GITHUB_OUTPUT
            elif echo "$COMMITS" | grep -i -E '(feat:|feature:|new feature|minor)'; then
              echo "Found new feature, bumping minor version"
              echo "BUMP_TYPE=minor" >> $GITHUB_OUTPUT
            else
              echo "No major or minor changes detected, bumping patch version"
              echo "BUMP_TYPE=patch" >> $GITHUB_OUTPUT
            fi
          fi
      
      - name: Get latest tag
        id: get_latest_tag
        run: |
          git fetch --tags
          LATEST_TAG=$(git tag -l 'v*' --sort=-v:refname | head -n 1)
          BUMP_TYPE="${{ steps.bump_type.outputs.BUMP_TYPE }}"
          
          if [ -z "$LATEST_TAG" ]; then
            echo "No existing tags found, starting with v1.0.0"
            echo "LATEST_TAG=v1.0.0" >> $GITHUB_OUTPUT
            echo "NEW_TAG=v1.0.0" >> $GITHUB_OUTPUT
          else
            echo "Latest tag: $LATEST_TAG"
            echo "LATEST_TAG=$LATEST_TAG" >> $GITHUB_OUTPUT
            
            # Remove 'v' prefix for version calculation
            VERSION=${LATEST_TAG#v}
            
            # Split into major, minor, patch
            MAJOR=$(echo $VERSION | cut -d. -f1)
            MINOR=$(echo $VERSION | cut -d. -f2)
            PATCH=$(echo $VERSION | cut -d. -f3)
            
            # Increment version based on bump type
            if [ "$BUMP_TYPE" == "major" ]; then
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
            elif [ "$BUMP_TYPE" == "minor" ]; then
              MINOR=$((MINOR + 1))
              PATCH=0
            else
              PATCH=$((PATCH + 1))
            fi
            
            NEW_TAG="v$MAJOR.$MINOR.$PATCH"
            echo "New tag will be: $NEW_TAG (${BUMP_TYPE} bump)"
            echo "NEW_TAG=$NEW_TAG" >> $GITHUB_OUTPUT
          fi
      
      - name: Create and push tag
        run: |
          NEW_TAG=${{ steps.get_latest_tag.outputs.NEW_TAG }}
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git tag -a $NEW_TAG -m "Release $NEW_TAG"
          git push origin $NEW_TAG
        
      - name: Generate categorized changelog
        id: changelog
        run: |
          NEW_TAG=${{ steps.get_latest_tag.outputs.NEW_TAG }}
          PREV_TAG=${{ steps.get_latest_tag.outputs.LATEST_TAG }}
          
          echo "## $NEW_TAG ($(date +%Y-%m-%d))" > temp_changelog.md
          echo "" >> temp_changelog.md
          
          if [ "$PREV_TAG" != "$NEW_TAG" ]; then
            # Get all commits since last tag
            COMMITS=$(git log $PREV_TAG..HEAD --pretty=format:"%h %s" --no-merges)
            
            # Extract different types of changes
            FEATURES=$(echo "$COMMITS" | grep -i -E '(feat:|feature:|new feature)' || echo "")
            FIXES=$(echo "$COMMITS" | grep -i -E '(fix:|bug:|bugfix:|patch:)' || echo "")
            DOCS=$(echo "$COMMITS" | grep -i -E '(docs:|documentation:)' || echo "")
            CHORE=$(echo "$COMMITS" | grep -i -E '(chore:|maintenance:|refactor:|test:|ci:)' || echo "")
            OTHER=$(echo "$COMMITS" | grep -v -i -E '(feat:|feature:|fix:|bug:|bugfix:|docs:|documentation:|chore:|maintenance:|refactor:|test:|ci:)' || echo "")
            
            # Add features section if there are any
            if [ ! -z "$FEATURES" ]; then
              echo "### 🚀 Features" >> temp_changelog.md
              echo "$FEATURES" | sed 's/^/* /' >> temp_changelog.md
              echo "" >> temp_changelog.md
            fi
            
            # Add fixes section if there are any
            if [ ! -z "$FIXES" ]; then
              echo "### 🐛 Bug Fixes" >> temp_changelog.md
              echo "$FIXES" | sed 's/^/* /' >> temp_changelog.md
              echo "" >> temp_changelog.md
            fi
            
            # Add documentation section if there are any
            if [ ! -z "$DOCS" ]; then
              echo "### 📚 Documentation" >> temp_changelog.md
              echo "$DOCS" | sed 's/^/* /' >> temp_changelog.md
              echo "" >> temp_changelog.md
            fi
            
            # Add maintenance section if there are any
            if [ ! -z "$CHORE" ]; then
              echo "### 🔧 Maintenance" >> temp_changelog.md
              echo "$CHORE" | sed 's/^/* /' >> temp_changelog.md
              echo "" >> temp_changelog.md
            fi
            
            # Add other changes section if there are any
            if [ ! -z "$OTHER" ]; then
              echo "### 🔄 Other Changes" >> temp_changelog.md
              echo "$OTHER" | sed 's/^/* /' >> temp_changelog.md
              echo "" >> temp_changelog.md
            fi
          else
            echo "### 🎉 Initial release" >> temp_changelog.md
            echo "" >> temp_changelog.md
          fi
          
          # If CHANGELOG.md exists, append it to our new entry
          if [ -f CHANGELOG.md ]; then
            cat CHANGELOG.md >> temp_changelog.md
          fi
          
          # Replace the old changelog with the new one
          mv temp_changelog.md CHANGELOG.md
          
          # We don't commit the changelog as it would trigger another workflow run
          # The release workflow will include this changelog in the release notes
      
      - name: Send notification
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_CHANNEL: releases
          SLACK_COLOR: ${{ job.status }}
          SLACK_TITLE: New Release ${{ steps.get_latest_tag.outputs.NEW_TAG }}
          SLACK_MESSAGE: "A new version has been released! Check it out at https://github.com/${{ github.repository }}/releases/tag/${{ steps.get_latest_tag.outputs.NEW_TAG }}"
          SLACK_FOOTER: "Terraform AWS Certificate Module"
        continue-on-error: true
