name: "Terraform"

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform:
    name: "Terraform"
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.7
          terraform_wrapper: false

      - name: Debug Environment
        run: |
          echo "Current directory: $(pwd)"
          echo "Directory listing:"
          ls -la
          echo "Repository structure:"
          find . -type f -name "*.tf" | sort

      - name: Terraform Format
        id: fmt
        run: terraform fmt -check -recursive

      - name: Prepare Test Environment
        run: |
          echo "Creating test variables file..."
          cat > terraform.tfvars << EOF
          domain_name = "testdomain.com"
          dns_zone_id = "TEST_ID"
          subject_alternative_names = ["alternate.testdomain.com"]
          tags = {
            environment = "test"
          }
          EOF
          echo "Test variables file created:"
          cat terraform.tfvars

      - name: Terraform Init
        id: init
        run: terraform init -backend=false

      - name: Terraform Validate
        id: validate
        run: terraform validate

      - name: Terraform Plan (Syntax Check Only)
        id: plan
        run: |
          echo "Skipping actual plan execution for module testing"
          echo "Module syntax has been validated in previous steps"

      - name: Update PR with Terraform Status
        uses: actions/github-script@v6
        if: github.event_name == 'pull_request'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const output = `#### Terraform Format and Style 🖌\`${{ steps.fmt.outcome }}\`
            #### Terraform Initialization ⚙️\`${{ steps.init.outcome }}\`
            #### Terraform Validation 🤖\`${{ steps.validate.outcome }}\`
            
            Module syntax has been validated. Full plan execution is skipped for module testing.`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })
